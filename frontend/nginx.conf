server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /transactions {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /analytics {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /recurring {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
